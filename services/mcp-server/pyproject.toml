[project]
name = "sitestack-mcp-server"
version = "1.0.0"
description = "SiteStack FastMCP Server interfacing with Maryland SDAT/GIS, HUD SAFMR, and MTA GTFS-RT / Google Routes APIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "shapely>=2.0.6",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
