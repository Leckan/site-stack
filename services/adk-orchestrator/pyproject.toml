[project]
name = "sitestack-adk-orchestrator"
version = "1.0.0"
description = "Google ADK Multi-Agent Orchestrator for SiteStack Maryland Housing Entitlement & Capital Stack Modeling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "google-adk>=0.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "sse-starlette>=2.1.0",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

